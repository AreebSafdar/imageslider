<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="slider-shell">
      <section class="slider" aria-label="Featured images">
        <div class="slides" id="slides">
          <article class="slide active">
            <img
              src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80"
              alt="Mountain lake landscape"
            />
            <div class="slide-content">
              <p class="eyebrow">Adventure</p>
              <h1>Explore the wild</h1>
            </div>
          </article>

          <article class="slide">
            <img
              src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1200&q=80"
              alt="Forest trail at sunrise"
            />
            <div class="slide-content">
              <p class="eyebrow">Nature</p>
              <h1>Wake up with the sunrise</h1>
            </div>
          </article>

          <article class="slide">
            <img
              src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80"
              alt="Beautiful coast and sea"
            />
            <div class="slide-content">
              <p class="eyebrow">Escape</p>
              <h1>Find your coastal calm</h1>
            </div>
          </article>

          <article class="slide">
            <img
              src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1200&q=80"
              alt="City skyline at dusk"
            />
            <div class="slide-content">
              <p class="eyebrow">Urban</p>
              <h1>City lights after dark</h1>
            </div>
          </article>
        </div>

        <button class="nav prev" id="prevBtn" aria-label="Previous slide">
          <span aria-hidden="true">&#10094;</span>
        </button>
        <button class="nav next" id="nextBtn" aria-label="Next slide">
          <span aria-hidden="true">&#10095;</span>
        </button>

        <div class="indicators" aria-label="Slide indicators">
          <button class="dot active" data-index="0" aria-label="Go to slide 1"></button>
          <button class="dot" data-index="1" aria-label="Go to slide 2"></button>
          <button class="dot" data-index="2" aria-label="Go to slide 3"></button>
          <button class="dot" data-index="3" aria-label="Go to slide 4"></button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
